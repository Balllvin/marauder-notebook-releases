name: Publish verified Notebook release

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: notebook-release-publication
  cancel-in-progress: false

jobs:
  publish:
    name: Publish immutable signed release
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - name: Check out protected publisher code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: refs/heads/main
          fetch-depth: 0
          persist-credentials: false

      - name: Run the reviewed publisher
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NOTEBOOK_EXPECTED_TEAM_IDENTIFIER: ${{ vars.NOTEBOOK_EXPECTED_TEAM_IDENTIFIER }}
        run: scripts/publish_local.sh --publish
