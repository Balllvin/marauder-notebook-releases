name: Publish verified Notebook release

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write

concurrency:
  group: notebook-release-publication
  cancel-in-progress: false

env:
  INTAKE_REPOSITORY: Balllvin/marauder-notebook-release-intake
  # The checked-in default requires no Apple Developer membership. Enabling the
  # dormant Developer ID path must be a reviewed publisher-code change.
  NOTEBOOK_DISTRIBUTION_MODE: independent
  NOTEBOOK_EXPECTED_TEAM_IDENTIFIER: ""

jobs:
  publish:
    name: Publish immutable signed release
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - name: Check out protected publisher code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: refs/heads/main
          fetch-depth: 0
          persist-credentials: false

      - name: Prove this run uses protected main
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == "refs/heads/main" ]]
          git fetch --no-tags origin main:refs/remotes/origin/main
          [[ "$(git rev-parse HEAD)" == "$(git rev-parse refs/remotes/origin/main)" ]]
          scripts/verify_openssl.sh >/dev/null

      - name: Audit the current immutable release before publication
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: scripts/audit_latest_release.sh

      - name: Select the oldest unpublished intake
        id: intake
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          RELEASES="$RUNNER_TEMP/releases.json"
          RESULT="$RUNNER_TEMP/selected-intake.json"
          gh api --paginate --slurp \
            "repos/$GITHUB_REPOSITORY/releases?per_page=100" >"$RELEASES"
          python3 scripts/prepare_intake.py select \
            --repository-url "https://github.com/$INTAKE_REPOSITORY.git" \
            --releases "$RELEASES" \
            --result "$RESULT"
          AVAILABLE="$(jq -r '
            if (.available | type) == "boolean"
            then (.available | tostring)
            else error("available must be a boolean")
            end
          ' "$RESULT")"
          IGNORED_REF_COUNT="$(jq -er '.ignored_ref_count | select(type == "number" and . >= 0 and floor == .)' "$RESULT")"
          if [[ "$IGNORED_REF_COUNT" -gt 0 ]]; then
            echo "Ignored $IGNORED_REF_COUNT stale, malformed, or ambiguous intake refs."
          fi
          printf 'available=%s\n' "$AVAILABLE" >>"$GITHUB_OUTPUT"
          if [[ "$AVAILABLE" != "true" ]]; then
            echo "No unpublished Notebook release intake is waiting."
          fi

      - name: Fetch inert intake data and reverify every boundary
        if: ${{ steps.intake.outputs.available == 'true' }}
        id: release
        run: |
          set -euo pipefail
          git remote add intake "https://github.com/$INTAKE_REPOSITORY.git"
          git fetch --no-tags intake main:refs/remotes/intake/main
          git fetch --no-tags intake \
            '+refs/heads/publication/*:refs/remotes/intake/publication/*'
          OPENSSL_BIN="$(scripts/verify_openssl.sh)"
          RESULT="$RUNNER_TEMP/verified-release.json"
          python3 scripts/prepare_intake.py prepare-pending \
            --repository . \
            --selection "$RUNNER_TEMP/selected-intake.json" \
            --output "$RUNNER_TEMP/verified-intake" \
            --openssl "$OPENSSL_BIN" \
            --trusted-main-ref refs/remotes/intake/main \
            --result "$RESULT"
          INVALID_COUNT="$(jq -er '.invalid_candidate_count | select(type == "number" and . >= 0 and floor == .)' "$RESULT")"
          if [[ "$INVALID_COUNT" -gt 0 ]]; then
            echo "Quarantined $INVALID_COUNT invalid intake candidate(s) before selecting a verified release."
          fi
          for field in version build_number tag archive source_commit branch intake_commit; do
            value="$(jq -er --arg field "$field" '.[$field]' "$RESULT")"
            printf '%s=%s\n' "$field" "$value" >>"$GITHUB_OUTPUT"
          done

      - name: Verify the complete configured app signature
        if: ${{ steps.intake.outputs.available == 'true' }}
        env:
          ARCHIVE_NAME: ${{ steps.release.outputs.archive }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
          BUILD_NUMBER: ${{ steps.release.outputs.build_number }}
        run: |
          set -euo pipefail
          ARCHIVE="$RUNNER_TEMP/verified-intake/$ARCHIVE_NAME"
          EXPANDED="$RUNNER_TEMP/expanded-release"
          mkdir "$EXPANDED"
          python3 scripts/verify_release_archive.py --archive "$ARCHIVE"
          /usr/bin/ditto -x -k "$ARCHIVE" "$EXPANDED"
          APP="$EXPANDED/Marauder Notebook.app"
          [[ -d "$APP" && ! -L "$APP" ]]
          EXTRA_ENTRY="$(/usr/bin/find "$EXPANDED" -mindepth 1 -maxdepth 1 ! -name 'Marauder Notebook.app' -print -quit)"
          [[ -z "$EXTRA_ENTRY" ]]
          VERIFY_ARGUMENTS=(
            --app "$APP"
            --release-version "$RELEASE_VERSION"
            --build-number "$BUILD_NUMBER"
            --distribution-mode "$NOTEBOOK_DISTRIBUTION_MODE"
          )
          if [[ "$NOTEBOOK_DISTRIBUTION_MODE" == "developer-id" ]]; then
            [[ "$NOTEBOOK_EXPECTED_TEAM_IDENTIFIER" =~ ^[A-Z0-9]{10}$ ]]
            VERIFY_ARGUMENTS+=(
              --expected-team-identifier "$NOTEBOOK_EXPECTED_TEAM_IDENTIFIER"
            )
          else
            [[ "$NOTEBOOK_DISTRIBUTION_MODE" == "independent" ]]
            [[ -z "$NOTEBOOK_EXPECTED_TEAM_IDENTIFIER" ]]
          fi
          python3 scripts/verify_app_bundle.py "${VERIFY_ARGUMENTS[@]}"
          if [[ "$NOTEBOOK_DISTRIBUTION_MODE" == "developer-id" ]]; then
            /usr/bin/xcrun stapler validate "$APP"
            /usr/sbin/spctl --assess --type execute --verbose=4 "$APP"
          fi

      - name: Enforce immutable monotonic publication
        if: ${{ steps.intake.outputs.available == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          INTAKE_BRANCH: ${{ steps.release.outputs.branch }}
          INTAKE_COMMIT: ${{ steps.release.outputs.intake_commit }}
        run: |
          set -euo pipefail
          [[ "$(gh api "repos/$GITHUB_REPOSITORY" --jq .visibility)" == "public" ]]
          [[ "$(gh api "repos/$GITHUB_REPOSITORY/immutable-releases" --jq '(.enabled == true) or (.enforced_by_owner == true)')" == "true" ]]
          CURRENT_INTAKE_REF="$(git ls-remote --exit-code --heads \
            "https://github.com/$INTAKE_REPOSITORY.git" \
            "refs/heads/$INTAKE_BRANCH")"
          [[ "$CURRENT_INTAKE_REF" == "$INTAKE_COMMIT"$'\t'"refs/heads/$INTAKE_BRANCH" ]]
          RELEASES="$RUNNER_TEMP/current-releases.json"
          gh api --paginate --slurp \
            "repos/$GITHUB_REPOSITORY/releases?per_page=100" >"$RELEASES"
          PUBLISHED_PLAN="$RUNNER_TEMP/published-source-plan.json"
          python3 scripts/release_state.py audit-published \
            --releases "$RELEASES" \
            --result "$PUBLISHED_PLAN"
          LATEST_PUBLISHED_TAG="$(jq -er '.tags[-1] // ""' "$PUBLISHED_PLAN")"
          SOURCE_LINK_ARGUMENTS=(
            --manifest "$RUNNER_TEMP/verified-intake/notebook-release.json"
            --openssl "$(scripts/verify_openssl.sh)"
          )
          if [[ -n "$LATEST_PUBLISHED_TAG" ]]; then
            PREVIOUS_RELEASE="$RUNNER_TEMP/previous-signed-release"
            mkdir "$PREVIOUS_RELEASE"
            gh release download "$LATEST_PUBLISHED_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --pattern notebook-release.json \
              --dir "$PREVIOUS_RELEASE"
            [[ -f "$PREVIOUS_RELEASE/notebook-release.json" && \
               ! -L "$PREVIOUS_RELEASE/notebook-release.json" ]]
            SOURCE_LINK_ARGUMENTS+=(
              --previous-manifest "$PREVIOUS_RELEASE/notebook-release.json"
            )
          fi
          python3 scripts/verify_intake.py assert-source-link \
            "${SOURCE_LINK_ARGUMENTS[@]}"
          python3 scripts/verify_intake.py assert-newer \
            --manifest "$RUNNER_TEMP/verified-intake/notebook-release.json" \
            --releases "$RELEASES"

      - name: Create, compare, publish, and attest the release
        if: ${{ steps.intake.outputs.available == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
          BUILD_NUMBER: ${{ steps.release.outputs.build_number }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          ARCHIVE_NAME: ${{ steps.release.outputs.archive }}
          SOURCE_COMMIT: ${{ steps.release.outputs.source_commit }}
          INTAKE_BRANCH: ${{ steps.release.outputs.branch }}
          INTAKE_COMMIT: ${{ steps.release.outputs.intake_commit }}
        run: |
          PUBLISHER_COMMIT="$(git rev-parse HEAD)"
          python3 scripts/publish_release.py \
            --repository "$GITHUB_REPOSITORY" \
            --intake-repository "$INTAKE_REPOSITORY" \
            --publisher-commit "$PUBLISHER_COMMIT" \
            --release-version "$RELEASE_VERSION" \
            --build-number "$BUILD_NUMBER" \
            --release-tag "$RELEASE_TAG" \
            --archive-name "$ARCHIVE_NAME" \
            --source-commit "$SOURCE_COMMIT" \
            --intake-branch "$INTAKE_BRANCH" \
            --intake-commit "$INTAKE_COMMIT" \
            --intake "$RUNNER_TEMP/verified-intake" \
            --work "$RUNNER_TEMP/publish-state" \
            --distribution-mode "$NOTEBOOK_DISTRIBUTION_MODE"

      - name: Audit the current immutable release after publication
        if: ${{ always() && !cancelled() && steps.intake.outputs.available == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: scripts/audit_latest_release.sh
