name: Publisher checks

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publisher-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Reverify protected publisher main
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - name: Check out protected publisher main
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: refs/heads/main
          persist-credentials: false

      - name: Run the local publisher boundary verifier
        run: scripts/verify_publisher_boundary.sh
